<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FLAPPY BIRD — RETRO · Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 40%, #1a0030 0%, #050505 70%);
    font-family: 'Press Start 2P', monospace;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .arcade {
    position: relative;
    padding: 16px;
    background: linear-gradient(135deg, #201020, #0a0a10);
    border: 4px solid #30202a;
    border-radius: 16px;
    box-shadow:
      0 0 0 2px #000,
      0 0 40px rgba(255, 100, 200, 0.3),
      0 0 80px rgba(100, 200, 255, 0.15),
      inset 0 0 30px rgba(0,0,0,0.8);
  }

  .screen {
    position: relative;
    width: 400px;
    height: 600px;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
    box-shadow:
      inset 0 0 40px rgba(0,0,0,0.9),
      0 0 20px rgba(100, 200, 255, 0.4);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: pointer;
  }

  .scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.35) 0px,
      rgba(0, 0, 0, 0.35) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 2;
  }

  .glass {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
    z-index: 3;
    animation: flicker 8s infinite;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    48% { opacity: 1; }
    49% { opacity: 0.92; }
    50% { opacity: 1; }
    78% { opacity: 1; }
    79% { opacity: 0.96; }
    80% { opacity: 1; }
  }

  /* === КОНСОЛЬ === */
  #console {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 220px;
    background: rgba(0, 8, 0, 0.94);
    border-top: 2px solid #0f0;
    transform: translateY(100%);
    transition: transform 0.18s ease;
    z-index: 10;
    display: flex;
    flex-direction: column;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: #0f0;
    box-shadow: 0 -4px 20px rgba(0, 255, 0, 0.25);
  }
  #console.open {
    transform: translateY(0);
  }
  #console-log {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.4;
  }
  #console-log::-webkit-scrollbar { width: 6px; }
  #console-log::-webkit-scrollbar-thumb { background: #0a4; }
  #console-input-wrap {
    display: flex;
    align-items: center;
    padding: 8px 12px;
    border-top: 1px solid #0a4;
    background: rgba(0, 30, 0, 0.6);
  }
  #console-prompt {
    color: #0f0;
    margin-right: 8px;
    font-weight: bold;
  }
  #console-input {
    flex: 1;
    background: transparent;
    border: none;
    color: #0f0;
    outline: none;
    font-family: inherit;
    font-size: inherit;
    caret-color: #0f0;
  }
  .log-line { margin: 1px 0; }
  .log-line.err { color: #ff5555; }
  .log-line.ok  { color: #55ff88; }
  .log-line.echo { color: #ffffff; }
  .log-line.sys { color: #00ffff; }

  .label {
    position: absolute;
    bottom: -34px;
    left: 0;
    right: 0;
    text-align: center;
    color: #8ecdf8;
    font-size: 10px;
    letter-spacing: 2px;
    text-shadow: 0 0 6px #8ecdf8;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div class="arcade">
  <div class="screen">
    <canvas id="game" width="200" height="300"></canvas>
    <div class="scanlines"></div>
    <div class="glass"></div>
    <div id="console">
      <div id="console-log"></div>
      <div id="console-input-wrap">
        <span id="console-prompt">&gt;</span>
        <input id="console-input" type="text" autocomplete="off" spellcheck="false" placeholder="help — список команд" />
      </div>
    </div>
  </div>
  <div class="label">INSERT COIN · [`] CONSOLE</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const W = canvas.width;
const H = canvas.height;

// --- Константы ---
const START_SCORE = 0;
const START_SPEED_LEVEL = 0;
const GROUND_H = 45;
const GRAVITY = 0.27;
const JUMP = -4.25;
const PIPE_W = 36;
const PIPE_GAP = 82;
const BASE_PIPE_SPEED = 1.5;
const BASE_PIPE_SPAWN = 1450;
const SPEED_STEP = 0.025;
const MAX_PIPE_SPEED = 4;
const SPAWN_STEP = 40;
const MIN_SPAWN = 900;
const BIRD_R = 8;

// --- Палитра ---
const COL = {
  sky: '#5c94fc',
  cloud: '#ffffff',
  cloudShadow: '#b8d0f0',
  pipeLight: '#58d858',
  pipe: '#00a800',
  pipeDark: '#005000',
  pipeShadow: '#007000',
  eye: '#ffffff',
  pupil: '#000000',
  ground: '#e4a044',
  groundDark: '#b86828',
  grassLight: '#8fe88f',
  grass: '#58d858',
  grassDark: '#007000',
  star: '#f8d800',
  starLight: '#fff8a0',
  shield: '#58d8f8',
  shieldLight: '#b8f0ff',
  text: '#ffffff',
  textShadow: '#000000',
  speed: '#ff5030',
};

// --- Скины ---
const SKINS = [
  { name: 'CLASSIC', bird: '#f8b800', birdLight: '#fce8a0', birdDark: '#b07800', beak: '#f87800', beakDark: '#a04800' },
  { name: 'BLUE',    bird: '#4890f8', birdLight: '#a8d8ff', birdDark: '#2050a0', beak: '#f87800', beakDark: '#a04800' },
  { name: 'RED',     bird: '#f84030', birdLight: '#ff9088', birdDark: '#a02018', beak: '#f8c800', beakDark: '#a08000' },
  { name: 'GREEN',   bird: '#58c848', birdLight: '#a8f090', birdDark: '#207018', beak: '#f87800', beakDark: '#a04800' },
  { name: 'PURPLE',  bird: '#a858f8', birdLight: '#d8a8ff', birdDark: '#6020a0', beak: '#f8c800', beakDark: '#a08000' },
  { name: 'GHOST',   bird: '#e8e8f0', birdLight: '#ffffff', birdDark: '#a0a0b0', beak: '#f87800', beakDark: '#a04800' },
];

let currentSkin = 0;
try {
  const s = Number(localStorage.getItem("flappySkin"));
  if (!isNaN(s) && s >= 0 && s < SKINS.length) currentSkin = Math.floor(s);
} catch(e) {}

function saveSkin() {
  try { localStorage.setItem("flappySkin", currentSkin); } catch(e) {}
}

// --- Состояние ---
let state = "ready";
let bird, pipes, score, best = 0, lastPipeTime, t = 0;
let particles = [];
let shake = 0;
let clouds = [];
let scorePulse = 0;
let deathTimer = 0;
let flashAlpha = 0;
let speedLevel = START_SPEED_LEVEL;
let speedPulse = 0;

// === МОДЫ (сохраняются между смертями) ===
let customSpeed = null;
let shieldOn = false;
let godMode = false;

try { best = Math.floor(Number(localStorage.getItem("flappyBest"))) || 0; } catch(e) { best = 0; }

function currentSpeed() {
  if (customSpeed !== null) return customSpeed;
  return Math.min(MAX_PIPE_SPEED, BASE_PIPE_SPEED + speedLevel * SPEED_STEP);
}
function currentSpawn() {
  return Math.max(MIN_SPAWN, BASE_PIPE_SPAWN - speedLevel * SPAWN_STEP);
}

function initClouds() {
  clouds = [];
  for (let i = 0; i < 5; i++) {
    clouds.push({
      x: Math.random() * W,
      y: 15 + Math.random() * 90,
      w: 16 + Math.floor(Math.random() * 20),
      h: 6 + Math.floor(Math.random() * 5),
      sp: 0.15 + Math.random() * 0.2
    });
  }
}
initClouds();

function reset() {
  bird = { x: 45, y: H / 2 - 20, vy: 0, wing: 0 };
  pipes = [];
  particles = [];
  score = START_SCORE;
  lastPipeTime = 0;
  deathTimer = 0;
  flashAlpha = 0;
  shake = 0;
  speedLevel = START_SPEED_LEVEL;
  speedPulse = 0;
  state = "ready";
}
reset();

// --- Управление ---
function flap() {
  if (consoleOpen) return;
  if (state === "ready") {
    state = "playing";
    bird.vy = JUMP;
    spawnFlapParticles();
  } else if (state === "playing") {
    bird.vy = JUMP;
    spawnFlapParticles();
  } else if (state === "gameover" && deathTimer > 0.6) {
    reset();
  }
}

document.addEventListener("keydown", (e) => {
  if (e.code === "Backquote") {
    e.preventDefault();
    toggleConsole();
    return;
  }
  if (consoleOpen) return;

  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    flap();
    return;
  }
  if (state === "ready") {
    if (e.code === "ArrowLeft" || e.code === "KeyA") {
      currentSkin = (currentSkin - 1 + SKINS.length) % SKINS.length;
      saveSkin();
    } else if (e.code === "ArrowRight" || e.code === "KeyD") {
      currentSkin = (currentSkin + 1) % SKINS.length;
      saveSkin();
    }
  }
});

function canvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (cx - rect.left) / rect.width * W,
    y: (cy - rect.top) / rect.height * H
  };
}

function trySelectSkin(e) {
  if (consoleOpen) return true;
  if (state !== "ready") return false;
  const c = canvasCoords(e);
  const startX = W / 2 - 30;
  const dotY = 150;
  for (let i = 0; i < SKINS.length; i++) {
    const dx = startX + i * 12;
    if (Math.abs(c.x - dx) < 9 && Math.abs(c.y - dotY) < 12) {
      currentSkin = i;
      saveSkin();
      return true;
    }
  }
  return false;
}

canvas.addEventListener("mousedown", (e) => {
  if (consoleOpen) return;
  if (trySelectSkin(e)) return;
  flap();
});
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (consoleOpen) return;
  if (trySelectSkin(e)) return;
  flap();
}, { passive: false });

// ============================================================
// ===  КОНСОЛЬ  ==============================================
// ============================================================
const consoleEl = document.getElementById("console");
const consoleLog = document.getElementById("console-log");
const consoleInput = document.getElementById("console-input");
let consoleOpen = false;

function toggleConsole(force) {
  consoleOpen = (force !== undefined) ? force : !consoleOpen;
  consoleEl.classList.toggle("open", consoleOpen);
  if (consoleOpen) {
    setTimeout(() => consoleInput.focus(), 20);
  } else {
    consoleInput.blur();
  }
}

function logConsole(msg, cls) {
  const line = document.createElement("div");
  line.className = "log-line" + (cls ? " " + cls : "");
  line.textContent = msg;
  consoleLog.appendChild(line);
  consoleLog.scrollTop = consoleLog.scrollHeight;
}

consoleInput.addEventListener("keydown", (e) => {
  e.stopPropagation();
  if (e.key === "Enter") {
    const val = consoleInput.value;
    consoleInput.value = "";
    execCommand(val);
  } else if (e.key === "Escape") {
    toggleConsole(false);
  }
});

function execCommand(input) {
  const trimmed = input.trim();
  if (!trimmed) return;

  const parts = trimmed.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const arg = parts[1] ? parts[1].toLowerCase() : "";
  const argRaw = parts[1] || "";

  logConsole("> " + trimmed, "echo");

  switch (cmd) {
    case "help":
      logConsole("Доступные команды:", "sys");
      logConsole("  help                  — этот список");
      logConsole("  speed <число>         — скорость труб (0.1–20)");
      logConsole("  speed reset           — вернуть авто-скорость");
      logConsole("  level <число>         — уровень скорости (0–999)");
      logConsole("  shield on|off         — бесконечный щит");
      logConsole("  god on|off            — полное бессмертие");
      logConsole("  score <число>         — установить счёт");
      logConsole("  reset                 — перезапустить игру");
      logConsole("  clear                 — очистить консоль");
      break;

    case "speed": {
      if (arg === "reset") {
        customSpeed = null;
        logConsole("Скорость возвращена к авто", "ok");
        break;
      }
      const n = parseFloat(argRaw);
      if (isNaN(n) || n <= 0 || n > 20) {
        logConsole("Использование: speed <0.1–20>  или  speed reset", "err");
      } else {
        customSpeed = n;
        logConsole("Скорость установлена: " + n.toFixed(2), "ok");
      }
      break;
    }

    case "level": {
      const n = parseInt(argRaw);
      if (isNaN(n) || n < 0 || n > 999) {
        logConsole("Использование: level <0–999>", "err");
      } else {
        speedLevel = n;
        logConsole("Уровень: " + n + "  (скорость " + currentSpeed().toFixed(2) + ")", "ok");
      }
      break;
    }

    case "shield":
      if (arg === "on") { shieldOn = true; logConsole("Щит ВКЛЮЧЁН (бесконечный)", "ok"); }
      else if (arg === "off") { shieldOn = false; logConsole("Щит ВЫКЛЮЧЕН", "ok"); }
      else logConsole("Использование: shield on|off", "err");
      break;

    case "god":
      if (arg === "on") { godMode = true; logConsole("God mode ВКЛЮЧЁН", "ok"); }
      else if (arg === "off") { godMode = false; logConsole("God mode ВЫКЛЮЧЕН", "ok"); }
      else logConsole("Использование: god on|off", "err");
      break;

    case "score": {
      const n = parseInt(argRaw);
      if (isNaN(n) || n < 0) logConsole("Использование: score <число>", "err");
      else { score = n; logConsole("Счёт: " + n, "ok"); }
      break;
    }

    case "reset":
      reset();
      logConsole("Игра перезапущена", "ok");
      break;

    case "clear":
      consoleLog.innerHTML = "";
      break;

    default:
      logConsole("Неизвестная команда: " + cmd + " (напиши help)", "err");
  }
}

logConsole("FLAPPY BIRD CONSOLE  v1.0", "sys");
logConsole("Напиши 'help' для списка команд", "sys");

// --- Частицы ---
function spawnFlapParticles() {
  for (let i = 0; i < 4; i++) {
    particles.push({
      x: Math.floor(bird.x - 4), y: Math.floor(bird.y + 3),
      vx: -0.5 - Math.random(),
      vy: (Math.random() - 0.5) * 1.5,
      life: 1, size: 1,
      color: SKINS[currentSkin].birdLight
    });
  }
}

function spawnScoreBurst(x, y) {
  for (let i = 0; i < 10; i++) {
    const a = (Math.PI * 2 * i) / 10;
    particles.push({
      x, y,
      vx: Math.cos(a) * (1 + Math.random()),
      vy: Math.sin(a) * (1 + Math.random()),
      life: 1, size: 1,
      color: Math.random() < 0.5 ? COL.star : COL.starLight
    });
  }
}

function spawnSpeedBurst() {
  const cols = ['#ff5030', '#f8d800', '#ff8020', '#fff8a0'];
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 3;
    particles.push({
      x: W / 2, y: H / 2,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      size: Math.random() < 0.5 ? 1 : 2,
      color: cols[Math.floor(Math.random() * cols.length)]
    });
  }
}

// --- Трубы ---
function spawnPipe() {
  const minTop = 50;
  const maxTop = H - GROUND_H - PIPE_GAP - 50;
  const gapY = Math.floor(minTop + Math.random() * (maxTop - minTop));
  pipes.push({ x: W + 10, gapY, passed: false });
}

function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy <= r * r;
}

// --- Update ---
function update(dt) {
  const d = dt / 16.67;
  t += dt;

  for (const c of clouds) {
    c.x -= c.sp * d;
    if (c.x < -c.w - 5) { c.x = W + 10; c.y = 15 + Math.random() * 90; }
  }

  for (const p of particles) {
    p.x += p.vx * d;
    p.y += p.vy * d;
    p.vy += 0.08 * d;
    p.life -= 0.04 * d;
  }
  particles = particles.filter(p => p.life > 0);

  if (state === "playing") {
    bird.vy += GRAVITY * d;
    bird.y += bird.vy * d;
    bird.wing += dt * 0.02;

    const speed = currentSpeed();
    const spawnInterval = currentSpawn();

    lastPipeTime += dt;
    if (lastPipeTime > spawnInterval) {
      lastPipeTime = 0;
      spawnPipe();
    }
    for (const p of pipes) p.x -= speed * d;
    pipes = pipes.filter(p => p.x + PIPE_W > -10);

    for (const p of pipes) {
      if (!p.passed && p.x + PIPE_W < bird.x) {
        p.passed = true;
        score++;
        scorePulse = 1;
        spawnScoreBurst(bird.x + 5, bird.y - 15);

        if (customSpeed === null && score % 10 === 0) {
          speedLevel++;
          speedPulse = 1;
          shake = Math.max(shake, 5);
          spawnSpeedBurst();
        }
      }
    }

    let hit = false;
    if (bird.y - BIRD_R < 0) { bird.y = BIRD_R; bird.vy = 0; }

    if (bird.y + BIRD_R > H - GROUND_H) {
      if (godMode) {
        bird.y = H - GROUND_H - BIRD_R;
        bird.vy = 0;
      } else {
        hit = true;
      }
    }

    for (const p of pipes) {
      const topHit = circleRect(bird.x, bird.y, BIRD_R, p.x, 0, PIPE_W, p.gapY);
      const by = p.gapY + PIPE_GAP;
      const botHit = circleRect(bird.x, bird.y, BIRD_R, p.x, by, PIPE_W, H - GROUND_H - by);

      if (topHit || botHit) {
        if (!shieldOn && !godMode) hit = true;
      }
    }

    if (hit) die();
  } else if (state === "ready") {
    bird.y = H / 2 - 20 + Math.sin(t * 0.004) * 4;
    bird.wing += dt * 0.02;
  } else if (state === "gameover") {
    deathTimer += dt / 1000;
    if (bird.y + BIRD_R < H - GROUND_H) {
      bird.vy += GRAVITY * d;
      bird.y += bird.vy * d;
    }
  }

  shake *= 0.88;
  flashAlpha *= 0.9;
  scorePulse *= 0.9;
  speedPulse *= 0.92;
}

function die() {
  state = "gameover";
  deathTimer = 0;
  shake = 8;
  flashAlpha = 0.8;
  const cols = ['#f8b800', '#f87800', '#ff5030', '#f8d800'];
  for (let i = 0; i < 22; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 2.5;
    particles.push({
      x: bird.x, y: bird.y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 1,
      life: 1,
      size: Math.random() < 0.5 ? 1 : 2,
      color: cols[Math.floor(Math.random() * cols.length)]
    });
  }
  if (score > best) {
    best = score;
    try { localStorage.setItem("flappyBest", best); } catch(e) {}
  }
}

// --- Отрисовка ---
function drawText(text, x, y, size, color, align) {
  ctx.font = `${size}px "Press Start 2P", monospace`;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = COL.textShadow;
  ctx.fillText(text, x + 1, y + 1);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawSky() {
  ctx.fillStyle = COL.sky;
  ctx.fillRect(0, 0, W, H - GROUND_H);
  ctx.fillStyle = '#f8f880';
  ctx.fillRect(W - 42, 20, 22, 22);
  ctx.fillStyle = '#f8d800';
  ctx.fillRect(W - 40, 22, 18, 18);
  ctx.fillStyle = '#fff8a0';
  ctx.fillRect(W - 38, 24, 8, 8);
}

function drawCloud(c) {
  const x = Math.floor(c.x);
  const y = Math.floor(c.y);
  ctx.fillStyle = COL.cloud;
  ctx.fillRect(x, y + 4, c.w, c.h - 4);
  ctx.fillRect(x + 4, y, c.w - 8, c.h);
  ctx.fillStyle = COL.cloudShadow;
  ctx.fillRect(x, y + c.h - 2, c.w, 2);
}

function drawPipe(p) {
  const x = Math.floor(p.x);
  drawPipeSegment(x, 0, PIPE_W, p.gapY, true);
  const by = p.gapY + PIPE_GAP;
  drawPipeSegment(x, by, PIPE_W, H - GROUND_H - by, false);
}

function drawPipeSegment(x, y, w, h, isTop) {
  if (h <= 0) return;
  ctx.fillStyle = COL.pipe;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = COL.pipeDark;
  ctx.fillRect(x, y, 2, h);
  ctx.fillRect(x + w - 2, y, 2, h);
  ctx.fillStyle = COL.pipeLight;
  ctx.fillRect(x + 4, y, 2, h);
  ctx.fillStyle = COL.pipeShadow;
  ctx.fillRect(x + w - 6, y, 2, h);

  const capH = 12;
  const capY = isTop ? y + h - capH : y;
  const capX = x - 2;
  const capW = w + 4;

  ctx.fillStyle = COL.pipe;
  ctx.fillRect(capX, capY, capW, capH);
  ctx.fillStyle = COL.pipeDark;
  ctx.fillRect(capX, capY, 2, capH);
  ctx.fillRect(capX + capW - 2, capY, 2, capH);
  if (isTop) ctx.fillRect(capX, capY + capH - 2, capW, 2);
  else ctx.fillRect(capX, capY, capW, 2);
  ctx.fillStyle = COL.pipeLight;
  ctx.fillRect(capX + 4, capY, 2, capH);
}

function drawGround() {
  const y = H - GROUND_H;
  ctx.fillStyle = COL.grass;
  ctx.fillRect(0, y, W, 6);
  ctx.fillStyle = COL.grassLight;
  ctx.fillRect(0, y, W, 2);
  ctx.fillStyle = COL.grassDark;
  ctx.fillRect(0, y + 6, W, 2);
  ctx.fillStyle = COL.ground;
  ctx.fillRect(0, y + 8, W, GROUND_H - 8);
  ctx.fillStyle = COL.groundDark;
  for (let yy = y + 10; yy < H; yy += 6) {
    for (let xx = 0; xx < W; xx += 10) {
      const off = ((yy / 6) % 2) * 4;
      ctx.fillRect(xx + off, yy, 2, 1);
    }
  }
}

function drawBirdSprite(x, y, skin, wingPhase) {
  x = Math.floor(x);
  y = Math.floor(y);

  const wingUp = Math.sin(wingPhase) > 0;
  ctx.fillStyle = skin.birdDark;
  if (wingUp) ctx.fillRect(x - 6, y - 4, 6, 4);
  else ctx.fillRect(x - 6, y + 2, 6, 4);

  ctx.fillStyle = skin.bird;
  ctx.fillRect(x - 5, y - 6, 10, 12);
  ctx.fillRect(x - 6, y - 5, 12, 10);

  ctx.fillStyle = skin.birdLight;
  ctx.fillRect(x - 5, y - 6, 10, 2);
  ctx.fillRect(x - 6, y - 5, 2, 2);
  ctx.fillRect(x + 4, y - 5, 2, 2);

  ctx.fillStyle = skin.birdDark;
  ctx.fillRect(x - 5, y + 4, 10, 2);
  ctx.fillRect(x - 6, y + 3, 2, 2);
  ctx.fillRect(x + 4, y + 3, 2, 2);

  ctx.fillStyle = COL.eye;
  ctx.fillRect(x + 2, y - 4, 4, 4);
  ctx.fillStyle = COL.pupil;
  ctx.fillRect(x + 4, y - 3, 2, 2);

  ctx.fillStyle = skin.beak;
  ctx.fillRect(x + 6, y, 4, 3);
  ctx.fillStyle = skin.beakDark;
  ctx.fillRect(x + 6, y + 2, 4, 1);
}

function drawBird() {
  const x = Math.floor(bird.x);
  const y = Math.floor(bird.y);

  if (shieldOn || godMode) {
    const pulse = Math.floor(Math.sin(t * 0.01) * 1.5 + 2);
    const auraR = BIRD_R + pulse + 2;
    const color = godMode ? '255, 100, 255' : '88, 216, 248';
    const alpha = 0.5 + Math.sin(t * 0.008) * 0.2;
    ctx.fillStyle = `rgba(${color}, ${alpha})`;
    for (let a = 0; a < 20; a++) {
      const ang = (a / 20) * Math.PI * 2;
      const px = Math.floor(x + Math.cos(ang) * auraR);
      const py = Math.floor(y + Math.sin(ang) * auraR);
      ctx.fillRect(px, py, 2, 2);
    }
  }

  drawBirdSprite(bird.x, bird.y, SKINS[currentSkin], bird.wing);
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawScore() {
  const color = scorePulse > 0.3 ? COL.star : COL.text;
  drawText(String(score), W / 2, 22, 14, color, 'center');
}

function drawSpeedUI() {
  const showLevel = speedLevel > 0 && customSpeed === null;
  const showCustom = customSpeed !== null;
  if (!showLevel && !showCustom) return;

  const x = 20;
  const y = 22;

  ctx.fillStyle = COL.speed;
  ctx.fillRect(x, y - 8, 4, 6);
  ctx.fillRect(x - 2, y - 2, 6, 4);
  ctx.fillRect(x, y + 2, 4, 4);
  ctx.fillStyle = COL.star;
  ctx.fillRect(x, y - 8, 2, 4);
  ctx.fillRect(x - 2, y - 2, 2, 2);

  const label = showCustom ? customSpeed.toFixed(1) : ('x' + speedLevel);
  drawText(label, x, y + 16, 6, COL.star, 'center');
}

function drawModsUI() {
  const mods = [];
  if (shieldOn) mods.push('SHIELD');
  if (godMode) mods.push('GOD');
  if (mods.length === 0) return;

  const y = 22;
  const txt = mods.join('·');
  ctx.font = '6px "Press Start 2P", monospace';
  const tw = ctx.measureText(txt).width;
  const x = W - 12 - tw;

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(x - 5, y - 8, tw + 10, 14);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = godMode ? '#ff60ff' : COL.shield;
  ctx.fillText(txt, x, y);
}

function drawReady() {
  drawText('FLAPPY', W / 2, 48, 14, COL.text, 'center');
  drawText('BIRD', W / 2, 70, 14, SKINS[currentSkin].birdLight, 'center');

  const previewSkin = SKINS[currentSkin];
  drawBirdSprite(W / 2, 110, previewSkin, t * 0.02);

  drawText(previewSkin.name, W / 2, 132, 6, previewSkin.birdLight, 'center');

  const startX = W / 2 - 30;
  const dotY = 150;
  for (let i = 0; i < SKINS.length; i++) {
    const dx = startX + i * 12;
    const sel = i === currentSkin;
    const pulse = sel ? Math.floor(Math.sin(t * 0.01) * 1 + 1) : 0;
    ctx.fillStyle = SKINS[i].bird;
    ctx.fillRect(dx - 3 - pulse, dotY - 3 - pulse, 6 + pulse * 2, 6 + pulse * 2);
    if (sel) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.strokeRect(dx - 5 + 0.5, dotY - 5 + 0.5, 10, 10);
    } else {
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 1;
      ctx.strokeRect(dx - 3 + 0.5, dotY - 3 + 0.5, 6, 6);
    }
  }

  drawText('A / D  OR  ← →', W / 2, 172, 5, 'rgba(255,255,255,0.6)', 'center');

  if (Math.floor(t / 450) % 2 === 0) {
    drawText('PRESS', W / 2, H - 68, 6, COL.text, 'center');
    drawText('SPACE', W / 2, H - 54, 6, COL.text, 'center');
  }

  drawText('BEST ' + best, W / 2, H - 28, 5, COL.star, 'center');
  drawText('[`] CONSOLE', W / 2, H - 46, 4, 'rgba(0,255,0,0.7)', 'center');
}

function drawGameOver() {
  const slide = Math.min(1, deathTimer * 3);
  ctx.fillStyle = `rgba(0,0,0,${0.65 * slide})`;
  ctx.fillRect(0, 0, W, H);
  if (slide < 0.25) return;

  const offsetY = (1 - slide) * -15;
  const panelW = 150;
  const panelH = 130;
  const panelX = (W - panelW) / 2;
  const panelY = (H - panelH) / 2 + offsetY;

  ctx.fillStyle = '#000';
  ctx.fillRect(panelX - 2, panelY - 2, panelW + 4, panelH + 4);
  ctx.fillStyle = '#180818';
  ctx.fillRect(panelX, panelY, panelW, panelH);
  ctx.strokeStyle = COL.speed;
  ctx.lineWidth = 1;
  ctx.strokeRect(panelX + 0.5, panelY + 0.5, panelW - 1, panelH - 1);

  drawText('GAME OVER', W / 2, panelY + 16, 7, COL.speed, 'center');
  ctx.fillStyle = COL.speed;
  ctx.fillRect(panelX + 10, panelY + 26, panelW - 20, 1);

  drawText('SCORE', W / 2, panelY + 42, 5, COL.text, 'center');
  drawText(String(score), W / 2, panelY + 58, 10, COL.star, 'center');
  drawText('BEST', W / 2, panelY + 78, 5, COL.text, 'center');
  drawText(String(best), W / 2, panelY + 92, 8, COL.starLight, 'center');

  if (deathTimer > 0.8 && Math.floor(t / 400) % 2 === 0) {
    drawText('PRESS SPACE', W / 2, panelY + panelH - 10, 5, COL.star, 'center');
  }
}

function draw() {
  ctx.save();

  if (shake > 0.5) {
    const sx = Math.round((Math.random() - 0.5) * shake);
    const sy = Math.round((Math.random() - 0.5) * shake);
    ctx.translate(sx, sy);
  }

  drawSky();
  for (const c of clouds) drawCloud(c);
  for (const p of pipes) drawPipe(p);

  drawParticles();
  drawBird();
  drawGround();
  ctx.restore();

  if (state !== 'ready') drawScore();
  if (state === 'playing') {
    drawSpeedUI();
    drawModsUI();
  }

  if (state === 'ready') drawReady();
  if (state === 'gameover') drawGameOver();

  if (flashAlpha > 0.01) {
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (speedPulse > 0.05) {
    ctx.fillStyle = `rgba(255,80,48,${speedPulse * 0.3})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// --- Цикл ---
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(now - lastTime, 50);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
